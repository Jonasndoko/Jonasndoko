<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}GESTSCO{% endblock %} · {{ cfg.NOM_ECOLE }}</title>
<link rel="icon" href="/assets/gestisc_32.png">
<style>
:root{--nuit:#0C1B3F;--bleu:#1D4ED8;--ciel:#87CEEB;--fond:#F4F6FB;--carte:#fff;--texte:#16213E;--gris:#5A6785;--bord:#C5CEE0;--rouge:#B3261E;--vert:#1E7B34}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fond:#0B1226;--carte:#14203F;--texte:#E8EDF9;--gris:#9FB0D4;--bord:#2A3A63;--bleu:#4C7DF0}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--fond);color:var(--texte);line-height:1.5}
header{background:var(--nuit);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:40px;width:auto}
header .nom{font-family:Georgia,serif;font-size:1.05rem;font-weight:bold;flex:1;min-width:0}
header .nom small{display:block;font-family:"Segoe UI",sans-serif;font-weight:normal;font-size:.75rem;color:#B7C7EE}
header form{margin:0}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-family:Georgia,serif;font-size:1.5rem;margin:0 0 4px}
.sous{color:var(--gris);margin:0 0 20px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:20px}
.form{max-width:420px;margin:32px auto}
label{display:block;font-size:.85rem;color:var(--gris);margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bord);border-radius:8px;font:inherit;background:var(--carte);color:var(--texte)}
input:focus{outline:2px solid var(--bleu);outline-offset:1px}
button,.bouton{display:inline-block;background:var(--bleu);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button:hover,.bouton:hover{filter:brightness(1.1)}
button.clair{background:transparent;border:1px solid #ffffff55;color:#fff;padding:6px 12px;font-weight:normal}
.plein{width:100%;margin-top:18px}
.erreur{background:#FDECEA;color:var(--rouge);border-radius:8px;padding:10px 12px;margin-bottom:8px;white-space:pre-line;font-size:.9rem}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .erreur{background:#3A1614;color:#FFB4AB}}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tuile{display:block;background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:18px;color:var(--texte);text-decoration:none;border-left:5px solid var(--bleu)}
.tuile:hover{border-left-color:var(--ciel);transform:translateY(-1px)}
.tuile b{display:block}
.tuile span{font-size:.8rem;color:var(--gris)}
.pastille{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;background:#FDF0DC;color:#8A5300;margin-top:6px}
.lien{color:var(--bleu)}
.onglets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--bord)}
.onglets a,.onglets .verrou{padding:9px 14px;border-radius:8px 8px 0 0;font-size:.9rem;text-decoration:none;color:var(--gris)}
.onglets a:hover{color:var(--texte)}
.onglets a.actif{background:var(--carte);color:var(--bleu);font-weight:600;border:1px solid var(--bord);border-bottom-color:var(--carte);margin-bottom:-1px}
.onglets .verrou{opacity:.55;cursor:not-allowed}
.ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ligne input,.ligne select{flex:1;min-width:150px;width:auto}
.defile{overflow-x:auto}
.tableau{width:100%;border-collapse:collapse;font-size:.92rem}
.tableau th{text-align:left;color:var(--gris);font-weight:600;font-size:.8rem;border-bottom:2px solid var(--bord);padding:8px 10px;white-space:nowrap}
.tableau td{border-bottom:1px solid var(--bord);padding:9px 10px;vertical-align:middle}
.tableau td.nb,.tableau th.nb{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tableau tr.groupe td{background:var(--fond);font-weight:700}
.tableau tr.total td{font-weight:700}
.tableau input{width:8.5rem;padding:7px 9px}
.tableau form{display:flex;gap:6px;align-items:center;margin:0}
.tableau button{padding:7px 12px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;border-radius:99px;padding:1px 9px}
.badge.solde{background:#DDF3E3;color:#1E6B30}.badge.partiel{background:#FDF0DC;color:#8A5300}.badge.impaye{background:#FDECEA;color:#B3261E}
.alerte{background:#FDF0DC;color:#7A4A00;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
.succes{background:#DDF3E3;color:#1E6B30;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .alerte{background:#3A2A0E;color:#FFD9A0}:root:not([data-theme=light]) .succes{background:#12301B;color:#9BE3B0}:root:not([data-theme=light]) .badge.solde{background:#12301B;color:#9BE3B0}:root:not([data-theme=light]) .badge.partiel{background:#3A2A0E;color:#FFD9A0}:root:not([data-theme=light]) .badge.impaye{background:#3A1614;color:#FFB4AB}}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;margin:0 0 4px}
.infos dt{font-size:.75rem;color:var(--gris);margin:0}.infos dd{margin:0;font-weight:600}
.bouton.second,button.second{background:transparent;color:var(--bleu);border:1px solid var(--bleu)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.espace{margin-top:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px}
.ticket{font-family:"Courier New",monospace;background:#fff;color:#111;border:1px dashed #999;border-radius:4px;padding:14px 16px;max-width:360px;white-space:pre-wrap;font-size:.85rem;line-height:1.35}
.pied{text-align:center;color:var(--gris);font-size:.8rem;padding:20px}
</style>
</head>
<body>
{% block cadre %}<header>
  <img src="/assets/logo_96.png" alt="">
  <div class="nom">{{ cfg.SIGLE_APP }} · {{ cfg.NOM_ECOLE }}<small>{{ cfg.DEVISE_ECOLE }}</small></div>
  {% block entete %}{% endblock %}
</header>
<main>{% block corps %}{% endblock %}</main>{% endblock %}
<div class="pied">{{ cfg.SIGLE_APP }} v{{ cfg.VERSION }} (version web)</div>
</body>
</html>
