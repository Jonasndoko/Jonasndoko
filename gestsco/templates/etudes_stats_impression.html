<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titre }} · {{ cfg.NOM_ECOLE }}</title>
<style>
@page{size:A4 landscape;margin:12mm}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:"Segoe UI",system-ui,sans-serif;color:#16213E;background:#fff;font-size:.9rem}
.tete{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0C1B3F;padding-bottom:8px;margin-bottom:12px}
.tete img{height:56px}.tete h1{font-family:Georgia,serif;font-size:1.3rem;margin:0}.tete p{margin:2px 0 0;color:#5A6785;font-size:.9rem}
.actions{margin:0 0 12px;display:flex;gap:8px}
.actions button,.actions a{background:#1D4ED8;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer;text-decoration:none}
.actions a{background:transparent;color:#1D4ED8;border:1px solid #1D4ED8}
table{border-collapse:collapse;width:100%;font-size:.82rem;margin-bottom:10px}
th,td{border:1px solid #8A97B5;padding:4px 6px;vertical-align:top}
thead th{background:#E7EAF3}td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:bold;background:#F1F3F9}
h3{font-size:1rem;margin:12px 0 4px}
.resume{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px}.resume div b{display:block;font-size:1.1rem}.resume div span{font-size:.75rem;color:#5A6785}
.st-note,.note{font-size:.75rem;color:#5A6785;margin:6px 0}
.st-detail td{color:#5A6785}
.sous{color:#5A6785}
.signatures{display:flex;justify-content:space-between;margin-top:34px;font-size:.85rem}.signatures div{width:30%;border-top:1px solid #16213E;padding-top:4px;text-align:center}
.pied{margin-top:10px;font-size:.78rem;color:#5A6785;display:flex;justify-content:space-between}
@media print{.actions{display:none}body{padding:0}}
</style>
</head>
<body>
<div class="actions"><button onclick="window.print()">Imprimer</button><a href="javascript:window.close()">Fermer</a></div>
<div class="tete">
  <img src="/assets/logo_96.png" alt="">
  <div><h1>{{ cfg.NOM_ECOLE }}</h1><p><b>{{ titre }}</b> · Année scolaire {{ r.annee }}</p></div>
</div>
{% with vue=r.vue, s=r.s, c=r.c %}{% include "_etudes_stats_corps.html" %}{% endwith %}
<div class="signatures"><div>La Directrice des études</div><div>Le Préfet des études</div></div>
<div class="pied"><span>Imprimé le {{ aujourdhui }} par {{ par }}</span><span>GESTSCO</span></div>
</body>
</html>
