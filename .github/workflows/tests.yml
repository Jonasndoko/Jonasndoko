name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt reportlab pillow
      - name: Vérifier que le code se compile
        run: python -m compileall -q .
      - name: Tests
        env:
          CSF_DATA_DIR: ${{ runner.temp }}/donnees
        run: |
          mkdir -p "$CSF_DATA_DIR"
          python -m unittest discover -s . -p "test_*.py"
