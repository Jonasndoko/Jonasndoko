{% extends "acces_base.html" %}
{% block contenu %}
<div class="carte" style="max-width:620px">
  <h2 style="margin:0 0 4px;font-size:1.15rem">{{ titre_secret }}</h2>
  <p class="sous">{{ nom }} · identifiant : {{ login }}</p>

</div>
{% endblock %}
